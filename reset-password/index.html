<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#284e43">
 <meta name="robots" content="noindex">
 <meta name="referrer" content="no-referrer">
 <title>Reset your password · Exegetical</title>
 <link rel="stylesheet" href="/style.css">
 <link rel="stylesheet" href="/reset-password/reset.css">
 <script type="module" src="/reset-password/reset.js"></script>
</head>
<body>
 <script src="/theme.js"></script>
 <main class="password-reset">
  <a href="/" class="brand"><span class="logo" aria-hidden="true">e<span>·</span></span><span>Exegetical</span></a>
  <h1>Reset your password</h1>
  <noscript><p>Enable JavaScript to reset your password.</p></noscript>
  <p id="resetStatus" role="status"></p>
  <form id="requestForm" method="post" hidden>
   <label class="label" for="resetEmail">Email</label>
   <input id="resetEmail" type="email" class="full-input" autocomplete="email" required>
   <button class="primary" type="submit">Send reset link</button>
  </form>
  <form id="newPasswordForm" method="post" hidden>
   <label class="label" for="newPassword">New password (at least 12 characters)</label>
   <input id="newPassword" name="password" class="full-input" type="password" minlength="12" autocomplete="new-password" autocapitalize="none" spellcheck="false" required>
   <div class="button-row">
    <button class="primary" type="submit">Update password</button>
    <button type="button" id="newPasswordVisibility" aria-controls="newPassword">Show password</button>
   </div>
  </form>
  <button type="button" id="retrySignOut" hidden>Retry signing out all devices</button>
  <a href="/" class="reset-back">Return to the Bible</a>
 </main>
</body>
</html>
